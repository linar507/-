let S={screen:'start',pi:0,st:0,err:0,time:100,cond:100,sel:[],done:{},mon:null,fb:null};
let actx=null,ctgRaf=null,ctgX=0,lastT=0;

function el(id){return document.getElementById(id)}
function go(sc){S.screen=sc;draw()}
function draw(){
 const a=el('app');
 if(S.screen==='start')a.innerHTML=vStart();
 else if(S.screen==='list')a.innerHTML=vList();
 else if(S.screen==='case'){a.innerHTML=vCase();updateSel();startCTG();}
 else if(S.screen==='death'){a.innerHTML=vDeath();stopCTG();}
 else if(S.screen==='recovered'){a.innerHTML=vRecovered();stopCTG();}
 else if(S.screen==='final'){a.innerHTML=vFinal();stopCTG();}
}
function flash(){const f=el('flash');if(!f)return;f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}

function vStart(){
 let p=PATIENTS.map((x,i)=>'<span>'+x.tag+'</span>').join(' ');
 return '<div class="card" style="text-align:center">'
 +'<svg class="uter" width="150" height="120" viewBox="0 0 150 120">'
 +'<path d="M30 40 Q30 12 75 12 Q120 12 120 40 L120 70 Q120 105 75 108 Q30 105 30 70 Z" fill="rgba(255,140,180,.25)" stroke="#ff8cb4" stroke-width="2"/>'
 +'<circle cx="75" cy="60" r="16" fill="rgba(255,179,224,.5)"><animate attributeName="r" values="14;18;14" dur="1.4s" repeatCount="indefinite"/></circle>'
 +'<text x="75" y="65" text-anchor="middle" font-size="13" fill="#ffd7ee">👶</text></svg>'
 +'<h1>Симулятор ведения гестозов</h1>'
 +'<div class="sub">7 пациенток • 3 этапа ведения у каждой • выбор 2 верных вмешательств из 4</div>'
 +'<div class="rule"><b>Как играть:</b> на каждом этапе предложены 4 вмешательства, из которых <b>ровно 2 правильных</b>. Отметьте оба верных и подтвердите выбор. После ошибки этап предлагается заново — с разбором всех вариантов.</div>'
 +'<div class="warn"><b>⚠ Цена ошибки:</b> первый неверный выбор отнимает по 50% времени и состояния пациентки и ухудшает показатели монитора. Вторая ошибка — <b>пациентка погибает</b>. У вас нет права на вторую ошибку.</div>'
 +'<div style="margin:10px 0;font-size:14px;color:#9fb4d4">Клинические случаи: '+p+'</div>'
 +'<button class="big" onclick="go(\'list\')">▶ Начать приём</button></div>';
}
function vList(){
 let h='<div class="card"><h1 style="font-size:22px">Пациентки</h1><div class="sub">Выберите случай. Статус сохраняется.</div>';
 PATIENTS.forEach((p,i)=>{
 let st=S.done[i]===true?'<small class="ok">✔ выздоровела</small>':S.done[i]===false?'<small class="bad">✖ погибла — можно переиграть</small>':'<small class="dim">ожидает приёма</small>';
 h+='<button class="pl-btn '+(S.done[i]===true?'done-ok':S.done[i]===false?'done-dead':'')+'" onclick="startCase('+i+')"><b>'+p.name+', '+p.age+' лет — '+p.weeks+' недель</b><br><small>'+p.tag+' • '+st+'</small></button>';
 });
 let allDone=PATIENTS.every((p,i)=>S.done[i]!==undefined);
 if(allDone)h+='<button class="big" onclick="go(\'final\')">📋 Итоги смены</button>';
 h+='<button class="big" style="background:rgba(255,255,255,.1)" onclick="go(\'start\')">← На заставку</button></div>';
 return h;
}
function vCase(){
 const p=PATIENTS[S.pi],st=p.stages[S.st];
 const chances=S.err===0?1:0;
 let h='<div class="card"><div class="head"><div><b>'+p.name+', '+p.age+' лет</b> <small class="dim">• '+p.weeks+' недель</small></div>'
 +'<div class="chips"><span>'+p.tag+'</span><span>Этап '+(S.st+1)+' из 3</span><span class="'+(chances?'':'')+'" style="color:'+(chances?'#5df09a':'#ff7b7b')+'">'+(chances?'❤ Осталась 1 попытка':'⛔ Последний шанс израсходован')+'</span></div></div>';
 h+='<div class="monitor">'
 +'<div class="mon"><div class="lbl">АД, мм рт. ст.</div><div class="val">'+S.mon.bp+'</div></div>'
 +'<div class="mon"><div class="lbl">Пульс</div><div class="val">'+S.mon.hr+'</div></div>'
 +'<div class="mon"><div class="lbl">SpO2, %</div><div class="val">'+S.mon.spo2+'</div></div>'
 +'<div class="mon fhr"><div class="lbl">ЧСС плода</div><div class="val">'+S.mon.fhr+'</div></div></div>';
 h+='<canvas id="ctg" width="600" height="64"></canvas>';
 h+='<div style="text-align:center"><button class="aus" onclick="playCTG()">🎧 Выслушать сердцебиение плода (КТГ)</button></div>';
 h+='<div class="bar"><div class="bl">⏳ Время: '+S.time+'%</div><div class="track"><div class="fill t" style="width:'+S.time+'%"></div></div></div>';
 h+='<div class="bar"><div class="bl">🤰 Состояние пациентки: '+S.cond+'%</div><div class="track"><div class="fill c" style="width:'+S.cond+'%"></div></div></div>';
 h+='<div class="story">'+p.story+'</div>';
 if(S.fb==='ok')h+='<div class="fb-ok"><div class="fb-title">✔ Верно — оба вмешательства выбраны правильно</div>'+st.opts.filter(o=>o.ok).map(o=>'<div>• '+o.why+'</div>').join('')+'</div><button class="big green" onclick="nextStage()">'+(S.st===2?'Завершить лечение пациента →':'Перейти к следующему этапу →')+'</button>';
 else if(S.fb==='err')h+='<div class="fb-err"><div class="fb-title">✖ Ошибка! Время и состояние −50%. Показатели ухудшены.</div>'+st.opts.map(o=>'<div>• <b>'+o.t+'</b> — '+(o.ok?'верно: ':'неверно: ')+o.why+'</div>').join('')+'</div><button class="big red" onclick="retryStage()">↻ Попробовать этот этап заново</button>';
 else{
 h+='<div class="sub" style="text-align:left"><b>'+st.q+'</b><br><small>Отметьте ровно 2 правильных вмешательства из 4</small></div>';
 st.opts.forEach((o,i)=>{h+='<button class="opt" id="opt'+i+'" onclick="toggle('+i+')"><span class="ltr">'+String.fromCharCode(1040+i)+'</span>'+o.t+'</button>';});
 h+='<div class="sub" style="text-align:center">Выбрано: '+S.sel.length+' из 2</div>';
 h+='<button class="big" id="confirm" onclick="confirmAns()" disabled>Подтвердить выбор</button>';
 h+='<button class="big" style="background:rgba(255,255,255,.1);margin-top:6px" onclick="go(\'list\')">← Вернуться к списку (прогресс этапа сбросится)</button>';
 }
 return h+'</div>';
}
function toggle(i){
 if(S.sel.includes(i))S.sel=S.sel.filter(x=>x!==i);else if(S.sel.length<2)S.sel=S.sel.concat([i]);
 updateSel();
}
function updateSel(){
 const p=PATIENTS[S.pi];if(!p||!p.stages[S.st])return;
 p.stages[S.st].opts.forEach((o,i)=>{const b=el('opt'+i);if(!b)return;b.classList.remove('sel','good','badpick');
 if(S.fb==='ok'){if(o.ok)b.classList.add('good');}
 else if(S.fb==='err'){if(o.ok)b.classList.add('good');else if(S.sel.includes(i))b.classList.add('badpick');}
 else if(S.sel.includes(i))b.classList.add('sel');});
 const cb=el('confirm');if(cb)cb.disabled=S.sel.length!==2;
}
function confirmAns(){
 const st=PATIENTS[S.pi].stages[S.st];
 const ok=S.sel.every(i=>st.opts[i].ok);
 if(ok){S.fb='ok';draw();}
 else{
 S.err++;flash();
 if(S.err>=2){S.done[S.pi]=false;go('death');return;}
 S.time=Math.max(0,S.time-50);S.cond=Math.max(0,S.cond-50);
 S.mon={...PATIENTS[S.pi].mon2};S.fb='err';draw();
 }
}
function retryStage(){S.sel=[];S.fb=null;draw()}
function nextStage(){S.sel=[];S.fb=null;S.st++;if(S.st>=3){S.done[S.pi]=true;go('recovered');}else draw();}
function startCase(i){S.pi=i;S.st=0;S.err=0;S.time=100;S.cond=100;S.mon={...PATIENTS[i].mon};S.sel=[];S.fb=null;go('case')}
function vDeath(){
 const p=PATIENTS[S.pi];
 return '<div class="card death" style="text-align:center"><h1 style="color:#ff7b7b">🕯 Пациентка погибла</h1>'
 +'<p style="margin:12px 0;line-height:1.6"><b>'+p.name+', '+p.age+' лет</b><br>'+p.death+'</p>'
 +'<div class="warn" style="text-align:left">Так в реальной практике работают ловушки: отмена терапии, «безобидные» спазмолитики, гепарин при кровотечении, потеря времени на ожидание.</div>'
 +'<button class="big" onclick="startCase(S.pi)">↻ Начать этот случай заново</button>'
 +'<button class="big" style="background:rgba(255,255,255,.1);margin-top:6px" onclick="go(\'list\')">← К списку пациенток</button></div>';
}
function vRecovered(){
 const p=PATIENTS[S.pi];
 return '<div class="card recov" style="text-align:center"><h1 style="color:#5df09a">💐 Пациентка выздоровела</h1>'
 +'<p style="margin:12px 0;line-height:1.6"><b>'+p.name+', '+p.age+' лет</b> — '+p.weeks+' недель.<br>Родоразрешение проведено, состояние стабильное. '+p.tag.replace(/^[^\s]+\s/,'')+' купирован.</p>'
 +'<div class="sub">Ошибок в этом случае: '+S.err+'</div>'
 +'<button class="big green" onclick="go(\'list\')">← К списку пациенток</button></div>';
}
function vFinal(){
 let ok=0,dead=0;
 PATIENTS.forEach((p,i)=>{if(S.done[i]===true)ok++;else if(S.done[i]===false)dead++;});
 let rows=PATIENTS.map((p,i)=>'<tr><td>'+p.name+', '+p.age+'</td><td>'+p.tag+'</td><td class="'+(S.done[i]?'ok':'bad')+'">'+(S.done[i]?'выздоровела':'погибла')+'</td></tr>').join('');
 return '<div class="card" style="text-align:center"><h1>📋 Итоги смены</h1>'
 +'<div class="sub">Выздоровели: '+ok+' из 7 • Погибли: '+dead+'</div>'
 +'<table><tr><th>Пациентка</th><th>Нозология</th><th>Исход</th></tr>'+rows+'</table>'
 +'<div class="'+(dead===0?'fb-ok':'warn')+'" style="text-align:left;margin-top:12px">'+(dead===0?'Все пациентки живы. Врач принят в штат 🙂':'Проанализируйте причины гибели: чаще всего это потеря времени, отмена терапии или выбор тактики «по привычке», а не по конкретной пациентке.')+'</div>'
 +'<button class="big" onclick="S.done={};go(\'list\')">↻ Новая смена</button></div>';
}

/* --- КТГ-канвас --- */
function startCTG(){stopCTG();const c=el('ctg');if(!c)return;const ctx=c.getContext('2d');lastT=performance.now();
 function loop(t){const c2=el('ctg');if(!c2){ctgRaf=null;return}
 const dt=(t-lastT)/1000;lastT=t;ctgX+=dt*60;
 const W=c2.width,H=c2.height;ctx.clearRect(0,0,W,H);
 const fhr=S.mon?S.mon.fhr:140;const per=40;
 ctx.strokeStyle=S.mon&&S.mon.fhr<110?'#ff7b7b':S.mon&&S.mon.fhr>160?'#ffd75e':'#7ee0ff';ctx.lineWidth=2;ctx.beginPath();
 for(let x=0;x<=W;x+=2){const ph=((x-ctgX)%per+per)%per;let y=H/2;
 if(ph>30&&ph<38)y=H/2+Math.sin((ph-30)/8*Math.PI)*(H*0.35);
 else if(ph>=10&&ph<14)y=H/2-H*0.22;
 ctx.lineTo(x,y);}
 ctx.stroke();
 const grid=ctx.strokeStyle;ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
 for(let gy=0;gy<H;gy+=16){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
 ctgRaf=requestAnimationFrame(loop);}
 ctgRaf=requestAnimationFrame(loop);}
function stopCTG(){if(ctgRaf){cancelAnimationFrame(ctgRaf);ctgRaf=null}}

/* --- Звук КТГ --- */
function playCTG(){
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 if(actx.state==='suspended')actx.resume();
 const fhr=S.mon.fhr,iv=60/fhr,t0=actx.currentTime+0.05;
 for(let i=0;i<12;i++){thump(t0+i*iv,62,0.13);thump(t0+i*iv+0.16,48,0.09);}}catch(e){}
}
function thump(t,f,d){
 const o=actx.createOscillator(),g=actx.createGain();
 o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*0.6,t+d);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.05);
}

draw();
</script>
